server:
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s

database:
  url: "postgres://nexus:nexus_secret@localhost:5432/nexusasset?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 1h

jwt:
  secret: "change-me-in-production-use-at-least-32-chars"
  access_token_expiry: 15m
  refresh_token_expiry: 168h

log:
  level: info
  format: json

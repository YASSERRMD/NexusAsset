version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexusasset_db
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_secret
      POSTGRES_DB: nexusasset
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexusasset"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
